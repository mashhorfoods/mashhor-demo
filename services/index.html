<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- This page lives one level down (/services/). <base> points every
     relative URL — assets, the sprite, the module import and route() — at
     the site root, whatever that root is (GitHub Pages subpath, a custom
     domain, a local server). In-page anchors therefore go through script,
     never through href="#…", which <base> would send to the homepage. -->
<base href="../">
<title data-i18n="page.services.title">خدماتنا — نمبرون للسفر و السياحة</title>
<meta name="description" data-i18n-content="page.services.description" content="كل خدمات السفر في مكان واحد: تذاكر الطيران والفنادق والتأشيرات والباقات والعمرة والنقل والسفر العلاجي والدراسة والعمل وخدمات التذاكر. نساعدك على اختيار الخدمة المناسبة لاحتياجك.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FE0002">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Number One Travel &amp; Tourism">
<meta property="og:title" content="خدماتنا — نمبرون للسفر و السياحة">
<meta property="og:description" content="كل ما تحتاجه لرحلتك في مكان واحد.">
<meta property="og:locale" content="ar_SD">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:url" content="https://mashhorfoods.github.io/mashhor-demo/services/">
<link rel="canonical" href="https://mashhorfoods.github.io/mashhor-demo/services/">
<meta property="og:image" content="https://mashhorfoods.github.io/mashhor-demo/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Number One Travel &amp; Tourism">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/foundation.css">
</head>

<body>
<a class="c-skip-link" href="#main" data-i18n="a11y.skip" data-skip>تخطَّ إلى المحتوى</a>

<div class="l-page">
  <!-- Global header: mounted by the script below. Stage 10.2 -->

  <main id="main" class="l-page__main">

    <!-- A — HERO ============================================================ -->
    <section class="l-section c-hero" aria-labelledby="services-title">
      <div class="l-container">
        <div class="c-hero__grid c-hero__grid--plain">
          <div data-services="hero" style="display:contents"></div>
        </div>
      </div>
    </section>

    <!-- B — CATEGORY NAVIGATION + what happens next ========================== -->
    <div data-services="nav" style="display:contents"></div>
    <section class="l-section l-section--tight l-section--subtle" aria-labelledby="kinds-title">
      <div class="l-container">
        <h2 class="u-visually-hidden" id="kinds-title" data-i18n="services.kinds.title">ماذا يحدث بعد اختيار الخدمة</h2>
        <div data-services="kinds"></div>
      </div>
    </section>

    <!-- C–F — SERVICE GROUPS ================================================ -->
    <div id="services-groups">
      <section class="l-section" data-services="group-core" aria-labelledby="cat-core" id="group-core">
        <div class="l-container"><div data-services-head></div><div data-services-grid></div></div>
      </section>
      <section class="l-section l-section--subtle" data-services="group-programmes" aria-labelledby="cat-programmes" id="group-programmes">
        <div class="l-container"><div data-services-head></div><div data-services-grid></div></div>
      </section>
      <section class="l-section" data-services="group-specialised" aria-labelledby="cat-specialised" id="group-specialised">
        <div class="l-container"><div data-services-head></div><div data-services-grid></div></div>
      </section>
      <section class="l-section l-section--subtle" data-services="group-tickets" aria-labelledby="cat-tickets" id="group-tickets">
        <div class="l-container"><div data-services-head></div><div data-services-grid></div></div>
      </section>
    </div>

    <!-- G — HELP ME CHOOSE ================================================== -->
    <section class="l-section" aria-labelledby="help-title" id="help">
      <div class="l-container">
        <div class="l-section-head">
          <p class="t-overline" data-i18n="home.choose.overline">ساعدني في الاختيار</p>
          <h2 class="t-h2" id="help-title" data-i18n="services.help.title">مش عارف تبدأ من وين؟</h2>
          <p class="t-body-lg t-muted" data-i18n="services.help.text">اختر ما يشبه حاجتك وسنأخذك إلى الخدمة المناسبة.</p>
        </div>
        <div data-services="help"></div>
      </div>
    </section>

    <!-- H — HUMAN SUPPORT =================================================== -->
    <section class="l-section l-section--subtle" aria-labelledby="support-title" id="support">
      <div class="l-container">
        <div class="l-section-head">
          <p class="t-overline" data-i18n="home.support.overline">دعم إنساني</p>
          <h2 class="t-h2" id="support-title" data-i18n="home.support.title">إذا احتجت مساعدة، نحن هنا.</h2>
          <p class="t-body-lg t-muted" data-i18n="home.support.text">حجز رقمي سريع، ومختص حقيقي عندما تحتاجه.</p>
        </div>
        <div data-services="support"></div>
      </div>
    </section>
  </main>

  <!-- I — Global footer: mounted by the script below. Stage 10.3 -->

  <nav class="c-bottom-nav" aria-label="التنقل السريع" data-i18n-label="nav.quick"><div id="bottom-nav" style="display:contents"></div></nav>
</div>

<script type="module">
  import {
    boot, el, qs, render, icon, route, pick,
    mountHeader, mountFooter, mountServices, supportPanels, NAV_BOTTOM,
  } from './assets/js/foundation.js';

  // <base> would send href="#main" to the homepage; the skip link scrolls here.
  qs('[data-skip]').addEventListener('click', (e) => { e.preventDefault(); const m = qs('#main'); m.tabIndex = -1; m.focus(); m.scrollIntoView(); });

  let services = null;

  function paint() {
    render(qs('#bottom-nav'), NAV_BOTTOM.map((item) =>
      el('a', { class: 'c-bottom-nav__item', href: route(item.href) },
        [icon(item.icon, { size: 'sm' }), el('span', {}, pick(item, 'label'))])));

    services = mountServices();
    render(qs('[data-services="support"]'), supportPanels());
    window.no = { ...(window.no ?? {}), services };   // QA handle: no.services.regions.core.error()
  }

  function mountChrome() {
    mountFooter({ target: qs('.l-page'), variant: 'marketing' });
    mountHeader({ target: qs('.l-page'), current: 'services',
      onSearch: () => { window.location.assign(route('') + '#booking'); } });
  }

  boot({ sprite: 'assets/icons/sprite.svg', onLocale: () => { mountChrome(); paint(); } });
  mountChrome();
  paint();
</script>
</body>
</html>
