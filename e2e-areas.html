<!doctype html><meta charset="utf-8"><title>areas</title><pre id="out"></pre>
<script>
var out=document.getElementById("out");
function log(s){ out.textContent += s + "\n"; }
var f=document.createElement("iframe");
f.style.cssText="width:1280px;height:1000px;border:0"; f.src="/admin/content.html";
f.onload=function(){ setTimeout(function(){
  var d=f.contentDocument;
  var cards=d.querySelectorAll("#areas .area");
  log("areas drawn: " + cards.length);
  Array.prototype.forEach.call(cards, function(c){
    var t=(c.textContent||"").replace(/\s+/g," ").trim().slice(0,64);
    var badge=c.querySelector(".badge");
    log("  " + t.trim() + (badge ? "   [" + badge.textContent.trim() + "]" : ""));
  });
  log("DONE");
},2800); };
document.body.appendChild(f);
</script>
