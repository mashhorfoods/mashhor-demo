<!doctype html><meta charset="utf-8"><title>e2e</title>
<pre id="out">running…</pre>
<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
function j(url, body){
  return fetch(url, {credentials:"same-origin", method: body?"POST":"GET",
    headers: body?{"Content-Type":"application/json","Accept":"application/json"}:{"Accept":"application/json"},
    body: body?JSON.stringify(body):undefined}).then(function(r){ return r.json(); });
}
out.textContent = "";
j("/api/csrf").then(function(c){
  return j("/api/auth/login", {csrf_token: c.csrf_token || c.token || c.csrf,
    email:"noura@aunaldrb.com", password:"Recovery-01-Local-Dev"});
}).then(function(r){
  log("login: " + (r.user ? r.user.name + " / " + r.user.role : JSON.stringify(r).slice(0,120)));
  return j("/api/admin/summary").then(function(sm){
    var c = sm.counts || {};
    log("summary   : new=" + c["new"] + " review=" + c.review + " confirmed=" + c.confirmed +
        " done=" + c.done + " total=" + c.total);
    log("new fields: overdue=" + c.overdue + " confirmedToday=" + c.confirmedToday +
        " doneThisMonth=" + c.doneThisMonth);
    return r;
  });
}).then(function(r){
  return new Promise(function(res){
    var f = document.createElement("iframe");
    f.style.cssText = "width:1200px;height:900px;border:0";
    f.src = "/admin/dashboard.html";
    f.addEventListener("load", function(){
      try { f.contentWindow.addEventListener("error", function(e){ f.contentWindow.__err = e.message; }); } catch(x){}
    });
    f.onload = function(){ setTimeout(function(){ res(f); }, 3500); };
    document.body.appendChild(f);
  });
}).then(function(f){
  var d = f.contentDocument;
  if (f.contentWindow.__err) log("PAGE ERROR: " + f.contentWindow.__err);
  function t(sel){ var e = d.querySelector(sel); return e ? e.textContent.trim() : "(missing)"; }
  log("whoname   : " + t("#whoname"));
  log("whorole   : " + t("#whorole"));
  log("whoname2  : " + t("#whoname2"));
  log("greeting  : " + t("#greet"));
  log("demobar   : " + (d.querySelector(".demobar") ? "STILL PRESENT" : "absent"));
  log("statebtn  : " + (d.querySelector("#statebtn") ? "STILL PRESENT" : "absent"));
  var kn = [].map.call(d.querySelectorAll("#kpis .state--ready .kpi__n"), function(e){return e.textContent;});
  var km = [].map.call(d.querySelectorAll("#kpis .state--ready .kpi__m b"), function(e){return e.textContent;});
  log("kpi nums  : " + kn.join(", "));
  log("kpi subs  : " + km.join(", "));
  log("blocks    : " + [].map.call(d.querySelectorAll("[data-state]"), function(e){
        return (e.id||e.className.split(" ")[0]) + "=" + e.getAttribute("data-state"); }).join(" "));
  var visRows = [].filter.call(d.querySelectorAll("#recentblock tbody tr"), function(r){return !r.hidden;}).length;
  var visAct  = [].filter.call(d.querySelectorAll("#actblock .act"), function(r){return !r.hidden;}).length;
  log("visible recent rows: " + visRows + " | visible activity rows: " + visAct);
  var body = d.body.innerText;
  ["أمل الصاعدي","نوف العتيبي","بيانات تجريبية","تجربة الحالات"].forEach(function(n){
    if (body.indexOf(n) > -1) log("LEAK: " + n + " is on screen");
  });
  log("DONE");
}).catch(function(e){ log("ERROR: " + (e && e.message ? e.message : e)); log("DONE"); });
</script>
