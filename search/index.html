<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- One level down: <base> points every relative URL at the site root.
     In-page moves go through script, never href="#…". Stage 11 -->
<base href="../">
<title data-i18n="page.search.title">نتائج البحث — السفر والسياحة</title>
<meta name="description" data-i18n-content="page.search.description" content="قارن الرحلات المتاحة لطلبك واختر الأنسب لك ولعائلتك.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FE0002">
<!-- A private step of someone's booking: never indexed, no canonical, no social card. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">

<link rel="icon" href="assets/brand/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/foundation.css">
</head>

<body>
<a class="c-skip-link" href="#main" data-i18n="a11y.skip" data-skip>تخطَّ إلى المحتوى</a>

<div class="l-page">
  <!-- Global header: mounted by the script below (the placeholder holds its space). Stage 10.2 -->
  <div class="c-gh c-gh--placeholder" aria-hidden="true"></div>

  <main id="main" class="l-page__main">
    <section class="l-section l-section--tight">
      <div class="l-container">
        <div class="l-stack l-stack--16">
          <div data-journey="progress"></div>
          <div data-journey="notice"></div>
          <div data-journey="summary"></div>
          <div class="c-journey">
            <div class="c-journey__main" data-journey="main"></div>
            <aside class="c-journey__aside" aria-label="تصفية النتائج" data-i18n-label="bk.filters.title" data-journey="aside"></aside>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Global footer: mounted by the script below. Stage 10.3 -->

  <nav class="c-bottom-nav" aria-label="التنقل السريع" data-i18n-label="nav.quick"><div id="bottom-nav" style="display:contents"></div></nav>
</div>

<script type="module">
  import { mountPage } from './assets/js/page.js';
  import { route } from './assets/js/data/config.js';
  import { mountResults } from './assets/js/booking/ui/results.js';

  mountPage({
    handle: 'results', bottom: 'search',
    header: { variant: 'booking', current: null, onSearch: () => location.assign(route('book/')) },
    footer: { variant: 'booking' },
    paint: () => mountResults({ root: document, params: new URLSearchParams(location.search) }),   // QA handle: no.results
  });
</script>
</body>
</html>
