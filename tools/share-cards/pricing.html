<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{--h1:50px;--text-w:560px}
/* Filled by render.mjs from the built pricing page. */
.tiles{position:absolute;left:56px;top:50px;width:500px;display:grid;grid-template-columns:1fr 1fr;gap:18px;rotate:-2deg}
.tile{background:#202020;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px 24px 18px;box-shadow:0 30px 60px -24px rgba(0,0,0,.85);display:flex;flex-direction:column;gap:6px;min-height:188px}
.tile:nth-child(2){translate:0 26px}.tile:nth-child(4){translate:0 26px}
.tile:first-child{background:#f4d13f;color:#202020;border-color:transparent}
.tile__name{font-size:21px;font-weight:800;line-height:1.3}
.tile__from{font-size:15px;opacity:.65;margin-top:auto}
.tile__price{font-family:Poppins;font-weight:700;font-size:54px;line-height:1;direction:ltr;text-align:right}
.tile__price small{font-size:17px;font-weight:600;opacity:.7;margin-left:8px}
.tile__billing{font-size:15px;font-weight:700;opacity:.7}
</style></head><body><div class="glow"></div>
<div class="tiles" id="tiles"></div>
<div class="text">
 <div><div class="brand">PI<b>X</b>ORA</div><div class="tag">Digital Agency</div></div>
 <div class="mid">
  <p class="eyebrow">الأسعار</p>
  <h1>كم يكلّف المشروع،<br><span class="acc">وما الذي يغيّر السعر.</span></h1>
  <p class="en">Every package and its price, published in full.</p>
 </div>
 <div class="foot"><span>أسعار منشورة</span><span>كوّن باقتك</span><span>بلا رسوم خفية</span></div>
</div>
<div class="edge"></div>
</body></html>
