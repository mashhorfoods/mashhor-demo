<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
/* A website from the portfolio, shown in Pixora's frame (1600×1200, 4:3 like
   the slideshow's frames): ?s=<site>&k=hero (the desktop page in a browser,
   its phone version beside it) or k=phones (three phone screens from
   different parts of the site). Screenshots: sites/<site>-desktop.jpg,
   sites/<site>-mobile-1..3.jpg (captured at 2× / 3×). sites.mjs renders and
   encodes these into overlay/assets/site-<site>[-phones].webp. No text in
   the image: the captions carry the words. */
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:1200px;overflow:hidden}
body{background:#141414;position:relative;font-family:system-ui,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 55% 45%,rgba(244,209,63,.12),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(closest-side at 55% 45%,#000,transparent)}
.shadow{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 60px 120px -40px rgba(0,0,0,.95),0 30px 60px -30px rgba(0,0,0,.8)}
/* The browser */
.browser{position:absolute;border-radius:20px;overflow:hidden;background:#1d1d1d}
.bar{height:48px;display:flex;align-items:center;gap:10px;padding:0 20px;background:#1f1f1f;direction:ltr;border-bottom:1px solid rgba(255,255,255,.06)}
.bar i{width:13px;height:13px;border-radius:50%;display:block}
.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{margin:0 auto;height:28px;width:46%;border-radius:999px;background:#2b2b2b;color:rgba(255,255,255,.55);font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.url svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2}
.screen{display:block;width:100%}
/* The phone */
.phone{position:absolute;border-radius:54px;background:#0b0b0b;padding:14px;border:1px solid rgba(255,255,255,.14)}
.phone img{display:block;width:100%;border-radius:42px}
.phone::before{content:"";position:absolute;top:26px;left:50%;width:96px;height:26px;margin-left:-48px;border-radius:20px;background:#0b0b0b;z-index:2}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<script>
const q = new URLSearchParams(location.search);
const s = q.get('s') || 'travel', k = q.get('k') || 'hero';
const SITES = { travel: '', aun: 'aunaldrb.com' };
const img = (n) => `sites/${s}-${n}.jpg`;
const phone = (src, x, y, w, rot = 0, z = 3) =>
  `<div class="phone shadow" style="left:${x}px;top:${y}px;width:${w}px;rotate:${rot}deg;z-index:${z}"><img src="${src}"></div>`;
const lock = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
if (k === 'hero') {
  // The browser on the right (where an Arabic page starts), the phone over its lower left corner.
  document.body.insertAdjacentHTML('beforeend',
    `<div class="browser shadow" style="left:330px;top:215px;width:1150px;z-index:2">
       <div class="bar"><i></i><i></i><i></i><span class="url">${lock}${SITES[s] || ''}</span></div>
       <img class="screen" src="${img('desktop')}">
     </div>` + phone(img('mobile-1'), 140, 425, 330, 0, 3));
} else {
  document.body.insertAdjacentHTML('beforeend',
    phone(img('mobile-1'), 1030, 200, 400, 4, 2) + phone(img('mobile-3'), 170, 200, 400, -4, 2) + phone(img('mobile-2'), 600, 140, 400, 0, 3));
}
</script>
</body></html>
