<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
/* An 18-second promo for Reels, TikTok and Shorts (1080×1920), in the identity
   of the posts. Every motion is a CSS animation on one timeline; reel.mjs
   pauses them all and steps the clock frame by frame, so the video is the
   same every time it is rendered.
   The platforms cover the top ~250px and the bottom ~450px with their own
   interface, and the right edge with buttons: everything sits in the middle,
   centred. */
@font-face{font-family:Cairo;src:url(fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Cairo;src:url(fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(fonts/Cairo-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
:root{--y:#f4d13f;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:#141414;color:#fff;font-family:Cairo,Poppins,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(820px 820px at 50% 46%,rgba(244,209,63,.15),transparent 70%);animation:breathe 18s linear both}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(closest-side at 50% 46%,#000,transparent);animation:drift 18s linear both}
@keyframes breathe{0%{opacity:.6}30%{opacity:1}60%{opacity:.75}100%{opacity:1}}
@keyframes drift{from{background-position:0 0}to{background-position:0 -180px}}

/* A scene: in at --a, out at --b (seconds). */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;
  animation:in .5s var(--ease) calc(var(--a) * 1s) both, out .4s ease-in calc(var(--b) * 1s) forwards}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{from{opacity:1}to{opacity:0;transform:translateY(-40px)}}
.rise{animation:rise .8s var(--ease) calc(var(--d) * 1s) both}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.pop{animation:pop .9s var(--ease) calc(var(--d) * 1s) both}
@keyframes pop{0%{opacity:0;transform:scale(1.9)}100%{opacity:1;transform:none}}
.fade{animation:fade .8s ease-out calc(var(--d) * 1s) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wipe{animation:wipe .7s var(--ease) calc(var(--d) * 1s) both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}

/* 1 — the wordmark */
.word{font-family:Poppins;font-weight:700;font-size:200px;line-height:1;letter-spacing:.02em;direction:ltr;display:flex}
.word span{display:inline-block}
.word .x{color:var(--y)}
.sub{font-family:Poppins;font-weight:500;font-size:28px;letter-spacing:.62em;color:rgba(255,255,255,.55);direction:ltr;margin-top:28px;margin-right:-.62em}
/* 2 — the promise */
.line{font-weight:800;font-size:112px;line-height:1.5}
.line.y{color:var(--y);font-size:132px}
/* 3–6 — the services */
.eyebrow{font-size:38px;font-weight:700;color:var(--y);display:flex;align-items:center;gap:20px}
.eyebrow::before,.eyebrow::after{content:"";width:60px;height:3px;background:var(--y)}
.h{font-weight:800;font-size:92px;line-height:1.45;margin-top:26px}
.h span{color:var(--y)}
.print{width:820px;aspect-ratio:16/10;border-radius:28px;overflow:hidden;margin-top:70px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 60px 110px -40px #000;animation:print .9s var(--ease) calc(var(--d) * 1s) both}
.print img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 2.2s linear calc(var(--d) * 1s) both}
@keyframes print{from{opacity:0;transform:translateY(120px) rotate(4deg) scale(.92)}to{opacity:1;transform:rotate(-2deg)}}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.count{position:absolute;top:1480px;left:0;right:0;display:flex;justify-content:center;gap:14px;opacity:0;animation:in .4s ease-out 5.4s both, out .3s ease-in 13s forwards}
.count i{width:90px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.count i::after{content:"";position:absolute;inset:0;background:var(--y);transform-origin:right;transform:scaleX(0);animation:fill 2s linear calc(var(--d) * 1s) both}
@keyframes fill{to{transform:scaleX(1)}}
/* 7 — the invitation */
.cta{font-weight:800;font-size:118px;line-height:1.45}
.cta.y{color:var(--y)}
.pill{margin-top:80px;display:inline-flex;align-items:center;gap:22px;border:2px solid rgba(244,209,63,.5);background:rgba(20,20,20,.9);border-radius:999px;padding:30px 56px;font-size:46px;font-weight:700}
.pill::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--y)}
.end{position:absolute;top:1420px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.end .word{font-size:84px}
.end .sub{font-size:16px;margin-top:14px}
</style></head><body>
<div class="glow"></div><div class="grid"></div>

<section class="scene" style="--a:0;--b:2.3">
  <div class="word">PIXORA</div>
  <p class="sub fade" style="--d:1.2">DIGITAL AGENCY</p>
</section>

<section class="scene" style="--a:2.7;--b:4.95">
  <p class="line rise" style="--d:2.8">علامتك.</p>
  <p class="line rise" style="--d:3.3">حضورك الرقمي.</p>
  <p class="line y pop" style="--d:3.9">شريك واحد.</p>
</section>

<div class="services"></div>
<div class="count"><i style="--d:5.4"></i><i style="--d:7.4"></i><i style="--d:9.4"></i><i style="--d:11.4"></i></div>

<section class="scene" style="--a:13.4;--b:99">
  <p class="cta rise" style="--d:13.5">عندك مشروع؟</p>
  <p class="cta y rise" style="--d:14">نبدأ من محادثة.</p>
  <p class="pill pop" style="--d:14.7">راسلنا — الرابط في البايو</p>
  <div class="end fade" style="--d:15.3"><div class="word">PI<span class="x">X</span>ORA</div><p class="sub">DIGITAL AGENCY</p></div>
</section>

<script>
// The wordmark, letter by letter (the X last, larger, in yellow).
document.querySelector('.word').innerHTML = [...'PIXORA'].map((c, i) =>
  c === 'X' ? `<span class="x pop" style="--d:.75">X</span>` : `<span class="rise" style="--d:${0.15 + i * 0.07}">${c}</span>`).join('');
// The four services, 1.75s each, from 5.4s.
const work = (f) => `../../overlay/assets/${f}`;
const site = (f) => `../../source/assets/${f}`;
const SERVICES = [
  ['الهوية والتصميم', 'ابنِ علامة', 'يتعرّف عليها الناس.', work('case-brand-identity-systems-guidelines.webp')],
  ['المواقع الإلكترونية', 'ابنِ تجربة رقمية', 'تؤدي عملها.', work('site-travel.webp')],
  ['إدارة وسائل التواصل', 'حضور مستمر', 'ومتّصل بجمهورك.', work('case-digital-campaigns-feed.webp')],
  ['الإعلانات', 'اصل إلى الجمهور الصحيح.', 'في اللحظة الصحيحة.', work('case-digital-campaigns-key-visual.webp')],
];
document.querySelector('.services').outerHTML = SERVICES.map(([name, l1, l2, img], i) => {
  const a = 5.4 + i * 2;
  const size = l1.length > 18 ? 'font-size:76px' : '';
  return `<section class="scene" style="--a:${a};--b:${a + 1.6}">
    <p class="eyebrow wipe" style="--d:${a}">${name}</p>
    <p class="h rise" style="--d:${a + 0.1};${size}">${l1}<br><span>${l2}</span></p>
    <figure class="print" style="--d:${a + 0.2}"><img src="${img}" style="--d:${a}"></figure>
  </section>`;
}).join('');
// The clock: reel.mjs calls this for each frame.
window.DURATION = 18;
// The soundtrack's timeline (music.py, "intro"): the signature on the
// wordmark (X at 0.75s) and again on the closing one; a hit per line of the
// promise; a bar of 120 BPM per service from 5.4s, four bars, to the invitation.
window.CUES = {
  style: 'intro', bpm: 120, duration: 18,
  logo: [0.15, 15.3],
  promise: [[2.8, ['B3', 'D4', 'F#4']], [3.3, ['G3', 'B3', 'D4']], [3.9, ['A3', 'C#4', 'E4', 'A4']]],
  drop: 5.4, groove: [5.4, 13.4],
  hits: [5.4],
  accents: [[1.2, 'chime'], [7.4, 'tick'], [9.4, 'tick'], [11.4, 'tick'], [13.5, 'note'], [14.0, 'note'], [14.7, 'pop']],
  whooshes: [[2.25, 0.4], [4.9, 0.45], [6.95, 0.4], [8.95, 0.4], [10.95, 0.4], [12.95, 0.4]],
  risers: [[4.4, 1.0]],
  outro: 15.9,
};
window.seek = (t) => { for (const an of document.getAnimations()) { an.pause(); an.currentTime = t * 1000; } };
window.seek(0);
</script>
</body></html>
