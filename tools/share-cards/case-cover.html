<script>
const scene = document.getElementById(new URLSearchParams(location.search).get('s'));
if (scene) scene.style.display = 'block';
const dots = document.getElementById('dots');
if (dots) {
  // A deterministic field of dots, with a gold cluster: the evidence the series draws out.
  let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let y = 20; y < 700; y += 34) for (let x = 20; x < 700; x += 34) {
    const d = Math.hypot(x - 350, y - 360);
    if (d > 330 + rnd() * 40) continue;
    const hot = Math.hypot(x - 420, y - 300) < 120 && rnd() > 0.25;
    dots.insertAdjacentHTML('beforeend', `<circle cx="${x}" cy="${y}" r="${hot ? 9 : 5}" fill="${hot ? '#f4d13f' : 'rgba(255,255,255,.22)'}"/>`);
  }
}
</script>
