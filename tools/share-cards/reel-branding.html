<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
/* A 10-second video for one service — Branding & Design — for Reels, TikTok,
   Shorts and as a paid ad (1080×1920). The hook is the case study's own line;
   the work lands piece by piece like prints on a table; it ends on the
   service page's headline and the invitation. Same clock as reel.html:
   reel.mjs pauses every animation and steps through the frames.
   Everything sits in the middle, clear of the platforms' own interface. */
@font-face{font-family:Cairo;src:url(fonts/Cairo-Medium.ttf);font-weight:500}
@font-face{font-family:Cairo;src:url(fonts/Cairo-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(fonts/Cairo-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Poppins;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
:root{--y:#f4d13f;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:#141414;color:#fff;font-family:Cairo,Poppins,sans-serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(820px 820px at 50% 48%,rgba(244,209,63,.15),transparent 70%);animation:breathe 10s linear both}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(closest-side at 50% 48%,#000,transparent);animation:drift 10s linear both}
@keyframes breathe{0%{opacity:.6}40%{opacity:1}100%{opacity:.85}}
@keyframes drift{from{background-position:0 0}to{background-position:0 -120px}}
.scene{position:absolute;inset:0;opacity:0;animation:in .45s var(--ease) calc(var(--a) * 1s) both, out .35s ease-in calc(var(--b) * 1s) forwards}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes out{from{opacity:1}to{opacity:0;transform:translateY(-40px)}}
.rise{animation:rise .75s var(--ease) calc(var(--d) * 1s) both}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
.pop{animation:pop .85s var(--ease) calc(var(--d) * 1s) both}
@keyframes pop{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:none}}
.fade{animation:fade .7s ease-out calc(var(--d) * 1s) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wipe{animation:wipe .6s var(--ease) calc(var(--d) * 1s) both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}

/* 1 — the hook */
.hook{font-weight:800;font-size:116px;line-height:1.25}
.hook.y{color:var(--y);font-size:136px}
/* 2 — the work, landing piece by piece */
.eyebrow{position:absolute;top:400px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;font-size:40px;font-weight:700;color:var(--y)}
.eyebrow::before,.eyebrow::after{content:"";width:60px;height:3px;background:var(--y)}
.print{position:absolute;margin:0;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 60px 100px -40px #000;
  rotate:var(--r);animation:land .8s var(--ease) calc(var(--d) * 1s) both}
.print img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes land{from{opacity:0;transform:translateY(560px) rotate(14deg) scale(.88)}to{opacity:1;transform:none}}
.chip{position:absolute;z-index:20;display:inline-flex;align-items:center;gap:12px;background:rgba(20,20,20,.94);border:1.5px solid rgba(244,209,63,.45);border-radius:999px;padding:12px 26px;font-size:30px;font-weight:700;animation:pop .6s var(--ease) calc(var(--d) * 1s) both}
.chip::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--y)}
.caption{position:absolute;top:1390px;left:0;right:0;text-align:center;font-size:44px;font-weight:700;line-height:1.45;color:rgba(255,255,255,.9)}
.caption span{color:var(--y)}
/* 3 — the invitation */
.h{font-weight:800;font-size:96px;line-height:1.25}
.h.y{color:var(--y)}
.pill{margin-top:80px;display:inline-flex;align-items:center;gap:22px;border:2px solid rgba(244,209,63,.5);background:rgba(20,20,20,.9);border-radius:999px;padding:30px 56px;font-size:46px;font-weight:700}
.pill::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--y)}
.end{position:absolute;top:1420px;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.word{font-family:Poppins;font-weight:700;font-size:84px;line-height:1;letter-spacing:.02em;direction:ltr}
.word b{color:var(--y)}
.sub{font-family:Poppins;font-weight:500;font-size:16px;letter-spacing:.62em;color:rgba(255,255,255,.55);direction:ltr;margin-top:14px;margin-right:-.62em}
</style></head><body>
<div class="glow"></div><div class="grid"></div>

<section class="scene center" style="--a:0;--b:2.15">
  <p class="hook rise" style="--d:.1">الشعار بداية<br>العلامة،</p>
  <p class="hook y pop" style="--d:.75">لا نهايتها.</p>
</section>

<section class="scene" style="--a:2.5;--b:7.05">
  <p class="eyebrow wipe" style="--d:2.5">الهوية والتصميم</p>
  <div class="work"></div>
  <p class="caption rise" style="--d:6.1">نظام كامل يُبقي علامتك<br><span>واحدة على كل واجهة.</span></p>
</section>

<section class="scene center" style="--a:7.4;--b:99">
  <p class="h rise" style="--d:7.5">ابنِ علامة</p>
  <p class="h y rise" style="--d:7.9">يتعرّف عليها الناس.</p>
  <p class="pill pop" style="--d:8.5">راسلنا — الرابط في البايو</p>
  <div class="end fade" style="--d:8.9"><div class="word">PI<b>X</b>ORA</div><p class="sub">DIGITAL AGENCY</p></div>
</section>

<script>
const work = (f) => `../../overlay/assets/case-brand-identity-systems-${f}.webp`;
// file, label, left, top, width, aspect, rotation, when it lands, where its label sits
const PIECES = [
  ['identity', 'لوحة الهوية', 120, 560, 620, '3/2', -6, 2.7, [150, 560]],
  ['guidelines', 'دليل الهوية', 360, 700, 600, '16/9', 4, 3.55, [700, 990]],
  ['packaging', 'التغليف', 150, 830, 340, '4/5', -3, 4.4, [130, 1210]],
  ['stationery', 'المطبوعات', 430, 1010, 560, '9/5', 5, 5.25, [740, 1300]],
];
document.querySelector('.work').outerHTML = PIECES.map(([f, label, x, y, w, ar, r, d, [cx, cy]], i) =>
  `<figure class="print" style="left:${x}px;top:${y}px;width:${w}px;aspect-ratio:${ar};--r:${r}deg;--d:${d};z-index:${i + 1}"><img src="${work(f)}"></figure>
   <span class="chip" style="left:${cx}px;top:${cy}px;--d:${d + 0.35}">${label}</span>`).join('');
window.DURATION = 10;
window.seek = (t) => { for (const an of document.getAnimations()) { an.pause(); an.currentTime = t * 1000; } };
window.seek(0);
</script>
</body></html>
