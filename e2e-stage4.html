<!doctype html><meta charset="utf-8"><title>s4</title><pre id="out"></pre>
<script>
var out=document.getElementById("out");
function log(s){ out.textContent += s + "\n"; }
function open_(src,wait){ return new Promise(function(res){
  var f=document.createElement("iframe"); f.style.cssText="width:1280px;height:1000px;border:0";
  f.src=src; f.onload=function(){ setTimeout(function(){ res(f); }, wait||2800); };
  document.body.appendChild(f); }); }

open_("/admin/services.html").then(function(f){
  var d=f.contentDocument, w=f.contentWindow;
  log("services.html");
  log("  new-service button : " + (d.getElementById("newbtn") ? (d.getElementById("newbtn").classList.contains("hidden")?"hidden":"visible") : "(absent)"));
  var btn=d.getElementById("newbtn"); if (btn) btn.click();
  return new Promise(function(r){ setTimeout(function(){ r([d,w]); }, 1800); });
}).then(function(a){
  var d=a[0];
  var wrap=d.getElementById("newwrap");
  log("  dialog opens       : " + (wrap && !wrap.hidden ? "yes" : "no"));
  var img=d.getElementById("nImage"), ico=d.getElementById("nIcon");
  log("  image choices      : " + (img?img.options.length:0));
  log("  icon choices       : " + (ico?ico.options.length:0) + (ico&&ico.options.length?("  e.g. "+ico.options[0].textContent):""));
  return open_("/admin/media.html");
}).then(function(f){
  var d=f.contentDocument;
  log("media.html");
  log("  upload button      : " + (d.getElementById("upbtn") ? "present" : "(absent)"));
  log("  assets listed      : " + d.querySelectorAll("#results .card, #results .asset, #grid .asset").length);
  log("DONE");
}).catch(function(e){ log("ERROR: "+(e&&e.message?e.message:e)); log("DONE"); });
</script>
