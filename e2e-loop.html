<!doctype html><meta charset="utf-8"><title>loop</title><pre id="out"></pre>
<script>
var out=document.getElementById("out");
function log(s){ out.textContent += s + "\n"; }
function open_(src){ return new Promise(function(res){
  var f=document.createElement("iframe"); f.style.cssText="width:1280px;height:900px;border:0";
  f.src=src; f.onload=function(){ setTimeout(function(){ res(f); }, 2600); };
  document.body.appendChild(f); }); }
function chip(d){ var c=d.getElementById("pendingchip");
  return c ? (c.hidden ? "(hidden)" : c.textContent.trim()) : "(absent)"; }

open_("/admin/content.html").then(function(f){
  var d=f.contentDocument;
  log("content.html");
  log("  pending chip : " + chip(d));
  log("  bar headline : " + (d.getElementById("pubT")||{}).textContent);
  log("  preview link : " + ((d.getElementById("previewbtn")||{}).href||"(none)").replace(location.origin,""));
  log("  publish btn  : " + (d.getElementById("publish") ? (d.getElementById("publish").disabled?"disabled":"enabled") : "(none)"));
  return open_("/admin/services.html");
}).then(function(f){
  var d=f.contentDocument;
  log("services.html");
  log("  pending chip : " + chip(d));
  log("  publish note : " + ((d.getElementById("pubnote")||{}).textContent||"").trim());
  log("  publish btn  : " + (d.getElementById("publishbtn") ? "present" : "(none)"));
  log("  false claim  : " + (d.body.innerText.indexOf("فور الحفظ") > -1 ? "STILL THERE" : "gone"));
  return open_("/admin/settings.html");
}).then(function(f){
  var d=f.contentDocument;
  log("settings.html");
  log("  pending chip : " + chip(d));
  log("  publish note : " + ((d.getElementById("pubnote")||{}).textContent||"").trim());
  log("  publish btn  : " + (d.getElementById("publishbtn") ? "present" : "(none)"));
  log("DONE");
}).catch(function(e){ log("ERROR: "+(e&&e.message?e.message:e)); log("DONE"); });
</script>
