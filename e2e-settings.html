<!doctype html><meta charset="utf-8"><title>probe</title><pre id="out"></pre>
<script>
var out=document.getElementById("out");
function log(s){ out.textContent += s + "\n"; }
var f=document.createElement("iframe");
f.style.cssText="width:1200px;height:900px;border:0";
f.src="/admin/settings.html";
f.onload=function(){ setTimeout(function(){
  var d=f.contentDocument;
  ["cName","cTag","cAddr","cPhone","cSite","cDesc"].forEach(function(id){
    var n=d.getElementById(id);
    log("  "+id+" = "+(n ? JSON.stringify(n.value) : "(missing)")+"   <"+(n?n.tagName.toLowerCase():"-")+">");
  });
  log("DONE");
},2500); };
document.body.appendChild(f);
</script>
