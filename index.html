  .site-header--on-dark:not(.is-scrolled) .site-header__menu-trigger{color:var(--white)}

  /* ==========================================================================
     RESPONSIVE (Desktop-first)
     ========================================================================== */
  @media (max-width:1200px){
    .grid{--grid-columns:12}
    .site-nav__link{padding-inline:var(--space-12)}
  }
  @media (max-width:768px){
    :root{--anchor-offset:80px}
    .grid{--grid-columns:8}
    .col-9,.col-10,.col-11,.col-12{grid-column:1 / -1}
    .site-nav,.site-header__cta{display:none}
    .site-header__menu-trigger{display:inline-flex}
    .site-header{--logo-h:clamp(30px,6vw,38px)}
    .site-footer__grid{gap:var(--space-40) var(--space-32)}
    .site-footer__brand{grid-column:1 / -1}
    .site-footer__links,.site-footer__services,.site-footer__contact,.site-footer__newsletter{grid-column:span 4}
    .site-footer__social{grid-column:1 / -1}
  }
  @media (max-width:480px){
    :root{--anchor-offset:72px}
    .grid{--grid-columns:4}
    .col-5,.col-6,.col-7,.col-8{grid-column:1 / -1}
    .site-header{--logo-h:30px}
    .site-footer__links,.site-footer__services,.site-footer__contact,.site-footer__newsletter{grid-column:1 / -1}
    .site-footer__bottom-inner{justify-content:flex-start}
  }
  @media (prefers-reduced-motion:reduce){
    .mobile-nav{transition:opacity var(--duration-fast) var(--ease-standard);transform:none}
    .mobile-nav.is-open{transform:none}
    .btn--primary:hover{transform:none}
  }
  </style>
</head>

  <script>
  /* ==========================================================================
     AL MADA — APPLICATION SHELL + NAVIGATION BEHAVIOR (Stage 03 + 04)
     ========================================================================== */
  (function () {
    "use strict";
    var doc = document;
    var root = doc.documentElement;
    var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* 1 · HEADER — transparent → solid on scroll */
    function initHeaderScrollState() {
      var header = doc.querySelector("[data-header]");
      if (!header) return;
      var THRESHOLD = 8, ticking = false;
      function update(){ header.classList.toggle("is-scrolled", window.scrollY > THRESHOLD); ticking = false; }
      function onScroll(){ if(!ticking){ window.requestAnimationFrame(update); ticking = true; } }
      update();
      window.addEventListener("scroll", onScroll, { passive: true });
    }

    /* 2 · MOBILE DRAWER — animated states + focus management */
    function initMobileNav() {
      var trigger = doc.querySelector("[data-menu-trigger]");
      var panel = doc.querySelector("[data-mobile-nav]");
      if (!trigger || !panel) return;
      var isOpen = false, closeTimer = null;
      function focusables(){ return panel.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])'); }
      function open(){
        if(isOpen) return; isOpen = true; window.clearTimeout(closeTimer);
        panel.hidden = false; panel.setAttribute("data-state","opening");
        trigger.setAttribute("aria-expanded","true"); trigger.setAttribute("aria-label","إغلاق القائمة");
        root.classList.add("has-mobile-nav-open");
        window.requestAnimationFrame(function(){ panel.classList.add("is-open"); panel.setAttribute("data-state","opened"); });
        var f = focusables(); if(f.length) f[0].focus();
      }
      function close(returnFocus){
        if(!isOpen) return; isOpen = false;
        panel.classList.remove("is-open"); panel.setAttribute("data-state","closing");
        trigger.setAttribute("aria-expanded","false"); trigger.setAttribute("aria-label","فتح القائمة");
        root.classList.remove("has-mobile-nav-open");
        var delay = prefersReducedMotion ? 0 : 300;
        closeTimer = window.setTimeout(function(){ panel.hidden = true; panel.setAttribute("data-state","closed"); }, delay);
        if(returnFocus !== false) trigger.focus();
      }
      trigger.addEventListener("click", function(){ isOpen ? close() : open(); });
      panel.addEventListener("click", function(e){ if(e.target.closest("a[href]")) close(false); });
      doc.addEventListener("keydown", function(e){
        if(!isOpen) return;
        if(e.key === "Escape"){ close(); return; }
        if(e.key === "Tab"){
          var f = focusables(); if(!f.length) return;
          var first = f[0], last = f[f.length-1];
          if(e.shiftKey && doc.activeElement === first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && doc.activeElement === last){ e.preventDefault(); first.focus(); }
        }
      });
      window.addEventListener("resize", function(){ if(window.innerWidth > 768 && isOpen) close(false); });
      panel.hidden = true; panel.setAttribute("data-state","closed"); trigger.setAttribute("aria-expanded","false");
    }

    /* 3 · SCROLL-REVEAL — architecture contract (no animation yet) */
    function initReveal() {
      var targets = doc.querySelectorAll("[data-reveal]");
      if(!targets.length) return;
      if(prefersReducedMotion || !("IntersectionObserver" in window)){ targets.forEach(function(el){ el.classList.add("is-inview"); }); return; }
      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){ if(entry.isIntersecting){ entry.target.classList.add("is-inview"); observer.unobserve(entry.target); } });
      }, { rootMargin:"0px 0px -10% 0px", threshold:0.1 });
      targets.forEach(function(el){ observer.observe(el); });
    }

    /* 4 · SCROLL-SPY / ACTIVE-NAV — drives .is-active on nav links */
    function initScrollSpy() {
      var sections = doc.querySelectorAll("[data-section][id]");
      if(!sections.length || !("IntersectionObserver" in window)) return;
      var navLinks = doc.querySelectorAll("[data-nav-link]");
      function setActive(id){
        doc.body.setAttribute("data-active-section", id);
        navLinks.forEach(function(link){
          var match = link.getAttribute("href") === "#" + id;
          link.classList.toggle("is-active", match);
          if(match) link.setAttribute("aria-current","true"); else link.removeAttribute("aria-current");
        });
      }
      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){ if(entry.isIntersecting) setActive(entry.target.id); });
      }, { rootMargin:"-45% 0px -55% 0px", threshold:0 });
      sections.forEach(function(s){ observer.observe(s); });
    }

    function init(){ initHeaderScrollState(); initMobileNav(); initReveal(); initScrollSpy(); }
    if(doc.readyState === "loading"){ doc.addEventListener("DOMContentLoaded", init); } else { init(); }
  })();
  </script>
