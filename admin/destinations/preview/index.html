<body>
<a class="c-skip-link" href="#main" data-i18n="a11y.skip" data-skip>تخطَّ إلى المحتوى</a>

<div class="l-page">
  <div class="c-gh c-gh--placeholder c-gh--placeholder-transparent" aria-hidden="true"></div>

  <main id="main" class="l-page__main">
    <section class="l-section c-hero c-hero--photo c-hero--full" aria-labelledby="dest-title">
      <div class="l-container"><div class="c-hero__grid" data-dest="hero"></div></div>
    </section>
    <section class="l-section l-section--subtle" data-dest="overview" aria-labelledby="overview-title" id="overview" hidden><div class="l-container" data-dest-body></div></section>
    <section class="l-section" data-dest="why" aria-labelledby="why-title" id="why" hidden><div class="l-container" data-dest-body></div></section>
    <section class="l-section l-section--subtle" data-dest="travel" aria-labelledby="travel-title" id="travel" hidden><div class="l-container" data-dest-body></div></section>
    <section class="l-section" data-dest="services" aria-labelledby="services-title" id="services" hidden><div class="l-container" data-dest-body></div></section>
    <section class="l-section l-section--subtle" data-dest="offers" aria-labelledby="offers-title" id="offers" hidden><div class="l-container" data-dest-body></div></section>
    <section class="l-section" data-dest="support" aria-labelledby="support-title" id="support" hidden><div class="l-container" data-dest-body></div></section>
  </main>
</div>

<script type="module">
  import { mountPage } from './assets/js/page.js';
  import { route } from './assets/js/data/config.js';
  import { mountOpsDestinationPreview } from './assets/js/ops/ui/preview.js';

  mountPage({
    handle: 'opsDestinationPreview',
    header: { current: 'destinations', onSearch: () => location.assign(route('book/')) },
    paint: () => mountOpsDestinationPreview({ id: new URLSearchParams(location.search).get('id') }),
  });
</script>
