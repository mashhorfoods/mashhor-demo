<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Relative refresh target ("dashboard/", not "/admin/dashboard/") so this works whether the
     site is served from a domain root or a subpath, with no script dependency. Some hosts 403
     a bare directory that has no index.html of its own instead of listing it, so /admin/ needs
     a real page here rather than relying on directory fallthrough. -->
<meta http-equiv="refresh" content="0; url=dashboard/">
<link rel="canonical" href="dashboard/">
<meta name="robots" content="noindex, nofollow">
<title>عمليات السفر والسياحة — السفر والسياحة</title>
</head>
<body>
<p>جارٍ التحويل إلى لوحة التحكم… <a href="dashboard/">اضغط هنا إذا لم يتم تحويلك تلقائيًا</a></p>
</body>
</html>
