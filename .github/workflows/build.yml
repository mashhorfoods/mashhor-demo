# Builds the site from source/ + overlay/, tests it, and publishes the upload
# package: Actions → the latest run → Artifacts → pixora-site-upload.
# Unzip its contents into public_html.
#
# On main it also publishes a preview to GitHub Pages
# (https://<owner>.github.io/<repo>/): the same site under the repo's path,
# without PHP (tools/pages.py). Needs Settings → Pages → Source: GitHub Actions.
#
# And, once the FTP secrets exist (LAUNCH.md, "النشر التلقائي"), uploads the
# tested site to the host: every save in the editing panel (/cms/) is a push
# to main, so it reaches the live site a few minutes later — or, if a test
# fails, not at all.
name: Build site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Before the build: it copies the editing panel (/cms/) from node_modules.
      - name: Install
        run: npm ci

      - name: Build
        run: python3 tools/build.py

      # Packed before the tests run, so no test data can end up in it.
      - name: Pack the upload
        run: |
          short_sha=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$short_sha" >> "$GITHUB_ENV"
          mkdir -p dist
          cp -a site "dist/pixora-site-$short_sha"

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test the site
        run: |
          php -S 127.0.0.1:8099 -t site tests/router.php > /dev/null 2>&1 &
          sleep 1
          BASE=http://127.0.0.1:8099 node tests/campaign.mjs

      - name: Test the admin page
        run: node tests/admin.mjs

      - name: Test content edits
        run: python3 tests/content.py

      - name: Test the editing panel
        run: node tests/cms.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: pixora-site-upload-${{ env.SHORT_SHA }}
          path: dist/pixora-site-${{ env.SHORT_SHA }}/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: Prepare the GitHub Pages preview
        if: github.ref == 'refs/heads/main'
        run: python3 tools/pages.py "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist/pages/

  # Upload to the host. Skipped (with a note in the run) until the secrets
  # FTP_SERVER, FTP_USERNAME and FTP_PASSWORD exist; FTP_DIR and FTP_PROTOCOL
  # are optional repository variables (public_html, ftps).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One upload at a time, in order: two quick saves never race.
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ vars.FTP_DIR || 'public_html' }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
    steps:
      - name: Check the FTP secrets
        id: secrets
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not uploaded: add the FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to publish automatically (LAUNCH.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'yes'

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'yes'
        with:
          pattern: pixora-site-upload-*
          path: upload
          merge-multiple: true

      - name: Upload to the host
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          sudo apt-get install -y lftp > /dev/null
          tools/deploy.sh upload

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
