<!doctype html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- One level down: <base> points every relative URL at the site root.
     In-page moves go through script, never href="#…". -->
<base href="../">
<title data-i18n="page.book.title">ابدأ الحجز — نمبرون للسفر و السياحة</title>
<meta name="description" data-i18n-content="page.book.description" content="اختر الخدمة، حدّد احتياجك، وتابع. تذاكر طيران وفنادق وتأشيرات وباقات وعمرة وسفر علاجي ونقل، في مدخل حجز واحد.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FE0002">
<meta name="robots" content="noindex">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Number One Travel &amp; Tourism">
<meta property="og:title" content="ابدأ الحجز — نمبرون للسفر و السياحة">
<meta property="og:description" content="اختر الخدمة، حدّد احتياجك، وتابع.">
<meta property="og:locale" content="ar_SD">
<meta property="og:locale:alternate" content="en_GB">
<meta property="og:url" content="https://mashhorfoods.github.io/mashhor-demo/book/">
<link rel="canonical" href="https://mashhorfoods.github.io/mashhor-demo/book/">
<meta property="og:image" content="https://mashhorfoods.github.io/mashhor-demo/assets/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Number One Travel &amp; Tourism">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-arabic-arabic-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/foundation.css">
</head>

<body>
<a class="c-skip-link" href="#main" data-i18n="a11y.skip" data-skip>تخطَّ إلى المحتوى</a>

<div class="l-page">
  <!-- Global header: mounted by the script below (the placeholder holds its space). Stage 10.2 -->
  <div class="c-gh c-gh--placeholder" aria-hidden="true"></div>

  <main id="main" class="l-page__main">
    <section class="l-section l-section--tight" aria-labelledby="book-title">
      <div class="l-container">
        <div class="l-section-head">
          <p class="t-overline" data-i18n="book.overline">الحجز</p>
          <h1 class="t-h1 u-mark" id="book-title" data-i18n="book.title">أريد أن أحجز… ماذا؟</h1>
          <p class="t-body-lg t-muted" data-i18n="book.lead">اختر الخدمة، حدّد احتياجك، وتابع. لا نعرض لك كل شيء؛ نرشّح لك الأنسب.</p>
        </div>

        <!-- 1 — SELECT SERVICE -->
        <h2 class="u-visually-hidden" data-i18n="book.selector.label">اختر الخدمة</h2>
        <div data-booking="selector"></div>
      </div>
    </section>

    <!-- 2 — DEFINE NEED · 3 — CONTINUE -->
    <section class="l-section l-section--tight l-section--subtle" aria-labelledby="book-form-title" id="book-form">
      <div class="l-container">
        <div class="c-book">
          <div class="c-book__main">
            <div class="l-stack l-stack--4">
              <h2 class="t-h3" id="book-form-title" data-i18n="book.form.title">حدّد احتياجك</h2>
              <p class="c-book__caption" data-booking="caption"></p>
              <div data-booking="attribution"></div>
            </div>
            <div data-booking="form"></div>
            <div data-booking="status"></div>
            <div data-booking="help"></div>
          </div>
          <div data-booking="trust"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Global footer: mounted by the script below. Stage 10.3 -->

  <nav class="c-bottom-nav" aria-label="التنقل السريع" data-i18n-label="nav.quick"><div id="bottom-nav" style="display:contents"></div></nav>
</div>

<script type="module">
  import { mountPage } from './assets/js/page.js';
  import { mountBooking } from './assets/js/components/booking.js';

  // ?vertical=…&to=…&service=…&offer=…&supervisor=… from any door on the site. Read once;
  // a language change keeps the chosen service but not the URL prefills.
  let requested = new URLSearchParams(location.search);
  mountPage({
    handle: 'booking', bottom: 'search',
    header: { variant: 'booking', current: null, onSearch: (booking) => booking?.widget.no.focus() },
    footer: { variant: 'booking' },   // the page is the booking entry itself
    paint: () => {
      const booking = mountBooking({ params: requested });   // QA handle: no.booking.region.error()
      requested = new URLSearchParams(`vertical=${booking.widget.no.current() ?? 'flights'}`);
      return booking;
    },
  });
</script>
</body>
</html>
